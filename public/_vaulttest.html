<!doctype html>
<!--
  Throwaway harness for the Memory vault (src/MemoryVault.jsx).
  Open http://localhost:5173/_vaulttest.html?cb=1  (bump ?cb every run)
  Read: document.querySelector('pre').innerText
  Delete when clean.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vault harness</title>
    <style>
      body { margin: 0; background: #0a0c14; color: #dfe4ee; font: 12px/1.5 ui-monospace, Consolas, monospace; }
      #out { white-space: pre-wrap; padding: 10px; }
      /* keep the iframe on screen: an off-screen or hidden tab renders no frames,
         and this run has to watch a particle loop move */
      #stage { padding: 10px; }
    </style>
  </head>
  <body>
    <pre id="out">running...</pre>
    <div id="stage"></div>
    <script>
      const log = []
      const say = (s) => { log.push(s); document.getElementById('out').innerText = log.join('\n') }
      let fails = 0
      const ok = (label, pass, detail) => {
        say(`${pass ? 'PASS' : 'FAIL'} | ${label}${detail ? ` — ${detail}` : ''}`)
        if (!pass) fails += 1
      }
      const info = (label, detail) => say(`INFO | ${label}${detail ? ` — ${detail}` : ''}`)
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const rect = (el) => el.getBoundingClientRect()
      const cs = (win, el) => win.getComputedStyle(el)
      const overlaps = (a, b) => !(a.right <= b.left + 1 || b.right <= a.left + 1 || a.bottom <= b.top + 1 || b.bottom <= a.top + 1)
      /* pull the WebGL buffer into a readable pixel grid */
      const grab = async (canvas) => {
        const img = new Image()
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = canvas.toDataURL('image/png') })
        const c = document.createElement('canvas')
        c.width = img.width
        c.height = img.height
        const g = c.getContext('2d')
        g.drawImage(img, 0, 0)
        return { px: g.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height }
      }

      const KEYS = ['nexora_user_session', 'nexora_onboarding_pending', 'nexora_pinned_chats']
      const stash = {}
      KEYS.forEach((k) => { stash[k] = localStorage.getItem(k); localStorage.removeItem(k) })
      const restore = () => KEYS.forEach((k) => {
        if (stash[k] === null) localStorage.removeItem(k)
        else localStorage.setItem(k, stash[k])
      })
      window.addEventListener('pagehide', restore)

      /* ── seed a real account through the real API: three memories, two threads
         whose titles echo two of them, so provenance has something to find ── */
      const api = async (path, body, token) => {
        const res = await fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        })
        const json = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(`${path} → ${res.status} ${JSON.stringify(json).slice(0, 160)}`)
        return json
      }

      const main = async () => {
        const email = `vault-${Date.now()}@harness.nexora.test`
        const reg = await api('/api/auth/register', { name: 'Vault Harness', email, password: 'harness-pass-1' })
        const token = reg.token
        if (!token) throw new Error('register returned no token')
        await api('/api/memory', { key: 'Preferred language', value: 'Reply in Roman Urdu whenever I write in it' }, token)
        await api('/api/memory', { key: 'Project name', value: 'The vault app is called Nexora' }, token)
        await api('/api/memory', { key: 'Favourite cricket team', value: 'Pakistan' }, token)
        const c1 = await api('/api/conversations', { title: 'Preferred language for Roman Urdu replies' }, token)
        await api('/api/conversations', { title: 'Nexora vault project deadline' }, token)
        /* A spoken turn writes a real user+assistant pair into that thread, so the
           harness can reach the has-thread layout without spending an AI call. */
        await api('/api/voice/realtime/turn', { conversationId: c1.id, userText: 'Reply in Roman Urdu jab main us mein likhun', assistantText: 'Theek hai — Roman Urdu mein jawab dunga.' }, token)
        info('seeded', `${email} · 3 memories · 2 threads (one with a turn in it)`)

        const f = document.createElement('iframe')
        f.style.cssText = 'width:1440px;height:900px;border:0'
        document.getElementById('stage').appendChild(f)
        f.src = '/'
        await wait(2200)
        const win = f.contentWindow
        const doc = win.document
        for (let i = 0; i < 60; i += 1) { if (doc.querySelector('body')) break; await wait(200) }
        /* hand the app a live session, then reload so React boots with it */
        win.localStorage.setItem('nexora_user_session', JSON.stringify({
          isLoggedIn: true, token,
          userProfile: { email, name: 'Vault Harness', avatar: null, isPremium: false, plan: 'free' },
          inWorkspace: true, activeView: 'Home',
        }))
        win.location.reload()
        await wait(2400)
        for (let i = 0; i < 60; i += 1) { if (win.document.querySelector('.workspace-nav')) break; await wait(250) }
        const d2 = win.document
        if (!d2.querySelector('.workspace-nav')) throw new Error('workspace never rendered')
        d2.documentElement.style.scrollBehavior = 'auto'
        win.__errs = []
        win.addEventListener('error', (e) => win.__errs.push(String(e.message)))

        const memoryBtn = [...d2.querySelectorAll('.workspace-nav-btn')].find((b) => b.textContent.trim() === 'Memory')
        ok('Memory nav exists', !!memoryBtn)
        memoryBtn.click()
        await wait(1400)

        say('\n===== GATE (the closed door) =====')
        const page = d2.querySelector('.vault-page')
        ok('vault page mounted', !!page)
        const gate = d2.querySelector('.vault-gate')
        ok('gate rendered', !!gate)
        const gateButtons = gate ? [...gate.querySelectorAll('button')] : []
        ok('exactly one button on the page', gateButtons.length === 1, gateButtons.map((b) => b.className).join(','))
        const openBtn = d2.querySelector('.vault-open')
        ok('button says View memory', /view memory/i.test(openBtn?.textContent ?? ''), JSON.stringify(openBtn?.textContent))
        ok('button is enabled (signed in)', !!openBtn && !openBtn.disabled)
        const paras = gate ? [...gate.querySelectorAll('p')] : []
        ok('2-3 lines of copy above it', paras.length >= 2 && paras.length <= 3, `${paras.length} lines`)
        ok('old cards are gone from the gate', !d2.querySelector('.vault-gate .memory-card') && !d2.querySelector('.vault-page > .memory-grid'))
        const gr = rect(d2.querySelector('.vault-page'))
        const or_ = rect(openBtn)
        ok('button sits dead centre', Math.abs((or_.left + or_.width / 2) - (gr.left + gr.width / 2)) < 2, `off ${(((or_.left + or_.width / 2) - (gr.left + gr.width / 2))).toFixed(1)}px`)
        ok('button is a real target', or_.height >= 48 && or_.width >= 140, `${Math.round(or_.width)}x${Math.round(or_.height)}`)
        ok('no horizontal overflow', d2.documentElement.scrollWidth <= win.innerWidth, `scrollWidth ${d2.documentElement.scrollWidth} vs ${win.innerWidth}`)
        ok('nothing but the door is on screen', !d2.querySelector('.chat-popover') && !d2.querySelector('.chat-popover-orb') && !d2.querySelector('.vault-stage'), `popover ${!!d2.querySelector('.chat-popover')}, stage ${!!d2.querySelector('.vault-stage')}`)

        say('\n===== THE DOOR OPENS (white light) =====')
        openBtn.click()
        await wait(60)
        const flash = d2.querySelector('.vault-flash')
        ok('light overlay appears on click', !!flash)
        if (flash) {
          const fs = cs(win, flash)
          const fr = rect(flash)
          ok('it is fixed and covers the whole display', fs.position === 'fixed' && Math.abs(fr.width - win.innerWidth) < 2 && Math.abs(fr.height - win.innerHeight) < 2, `${Math.round(fr.width)}x${Math.round(fr.height)} of ${win.innerWidth}x${win.innerHeight}`)
          ok('it sits above the app', Number(fs.zIndex) >= 90, `z-index ${fs.zIndex}`)
          ok('it never eats clicks', fs.pointerEvents === 'none')
          const core = flash.querySelector('.vault-flash-core')
          const coreStyle = cs(win, core)
          ok('the light is white', /255,\s*255,\s*255/.test(coreStyle.backgroundImage), coreStyle.backgroundImage.slice(0, 60))
          ok('the spill animation is armed', coreStyle.animationName === 'mv-spill' && coreStyle.animationDuration === '2.5s', `${coreStyle.animationName} ${coreStyle.animationDuration}`)
          ok('a bright seam opens first', !!flash.querySelector('.vault-flash-seam') && cs(win, flash.querySelector('.vault-flash-seam')).animationName === 'mv-seam')
          await wait(900)
          info('opacity sampled mid-blinding', cs(win, core).opacity)
        }
        await wait(2100)
        ok('the light is gone again', !d2.querySelector('.vault-flash'))

        say('\n===== THE BRAIN (particles + cables) =====')
        /* the assembly runs from ~1.75s to ~3.65s after the click — sample after that */
        await wait(1600)
        const stage = d2.querySelector('.vault-stage')
        ok('stage mounted', !!stage)
        const sr = rect(stage)
        ok('stage has real size', sr.width > 400 && sr.height > 300, `${Math.round(sr.width)}x${Math.round(sr.height)}`)
        const canvas = d2.querySelector('.vault-scene canvas')
        ok('WebGL canvas is in the scene', !!canvas)
        if (canvas) {
          const gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
          ok('a live WebGL context owns it', !!gl, gl ? `${gl.drawingBufferWidth}x${gl.drawingBufferHeight}` : 'none')
          /* the canvas fills the scene box, which is the stage's PADDING box — the
             stage's 1px border is not the canvas's business */
          const sceneBox = rect(d2.querySelector('.vault-scene'))
          const cr = rect(canvas)
          ok('canvas fills its scene box', Math.abs(cr.width - sceneBox.width) < 2 && Math.abs(cr.height - sceneBox.height) < 2, `${Math.round(cr.width)}x${Math.round(cr.height)} in a ${Math.round(sceneBox.width)}x${Math.round(sceneBox.height)} box`)

          say('  -- what is actually painted --')
          const { px, w, h } = await grab(canvas)
          let lit = 0, violet = 0, cyan = 0, white = 0, samples = 0
          let minX = w, maxX = -1, minY = h, maxY = -1
          /* a coarse density grid, so the shape can be read without a screenshot */
          const COLS = 100, ROWS = 24
          const cell = new Map()
          for (let y = 0; y < h; y += 2) {
            for (let x = 0; x < w; x += 2) {
              const i = (y * w + x) * 4
              samples += 1
              if (px[i + 3] < 8) continue
              const r = px[i], gg = px[i + 1], b = px[i + 2]
              if ((r + gg + b) / 3 < 24) continue
              lit += 1
              let kind = 'o'
              if (b > 90 && r > 90 && gg < r - 10) { violet += 1; kind = 'v' }
              else if (b > 120 && gg > 120 && r < gg - 10) { cyan += 1; kind = 'c' }
              else if (r > 235 && gg > 235 && b > 235) { white += 1; kind = 'w' }
              const key = Math.floor(y / h * ROWS) * COLS + Math.floor(x / w * COLS)
              const bucket = cell.get(key) || { v: 0, c: 0, w: 0, o: 0 }
              bucket[kind] += 1
              cell.set(key, bucket)
              if (x < minX) minX = x
              if (x > maxX) maxX = x
              if (y < minY) minY = y
              if (y > maxY) maxY = y
            }
          }
          const rate = lit / Math.max(samples, 1)
          ok('particles are on the screen', rate > 0.03, `${(rate * 100).toFixed(1)}% of ${w}x${h} is lit`)
          ok('the mass is alive with both palette ends', violet > 0 && cyan > 0, `violet ${violet} / cyan ${cyan}`)
          ok('the light has not blown out into a white blob', white / Math.max(lit, 1) < 0.25, `${((white / Math.max(lit, 1)) * 100).toFixed(1)}% pure white`)
          const cxp = (minX + maxX) / 2
          const cyp = (minY + maxY) / 2
          ok('the drawing is centred on the stage', Math.abs(cxp - w / 2) < w * 0.1 && Math.abs(cyp - h / 2) < h * 0.16, `centre ${Math.round(cxp)},${Math.round(cyp)} of ${w / 2},${h / 2}`)
          ok('it is an object, not a wash', maxX - minX < w * 0.95 && maxY - minY < h * 0.95, `mass ${maxX - minX}x${maxY - minY} in ${w}x${h}`)
          /* the brain is the dense core; the node beads and cables are sparse */
          const litIn = (x0, y0, x1, y1) => {
            let n = 0
            for (let y = Math.round(y0); y < y1; y += 2) {
              for (let x = Math.round(x0); x < x1; x += 2) {
                const i = (y * w + x) * 4
                if (px[i + 3] >= 8 && (px[i] + px[i + 1] + px[i + 2]) / 3 >= 24) n += 1
              }
            }
            return n
          }
          const coreBox = litIn(w * 0.35, h * 0.28, w * 0.65, h * 0.72)
          const cornerBox = litIn(0, 0, w * 0.3, h * 0.4)
          ok('the particles concentrate into a mass at the centre', coreBox > cornerBox * 4, `core ${coreBox} vs corner ${cornerBox}`)
          let art = ''
          for (let r = 0; r < ROWS; r += 1) {
            let line = ''
            for (let q = 0; q < COLS; q += 1) {
              const a = cell.get(r * COLS + q)
              if (!a) { line += '.'; continue }
              const top = Object.entries(a).sort((p, n) => n[1] - p[1])[0][0]
              line += top === 'v' ? 'V' : top === 'c' ? 'C' : top === 'w' ? 'W' : 'o'
            }
            art += `\n${line}`
          }
          say(`  what the canvas holds (V violet · C cyan · W white · o other):${art}`)
        }
        ok('scene itself is hidden from readers', canvas?.parentElement?.getAttribute('aria-hidden') === 'true')
        const labels = [...d2.querySelectorAll('.vault-node')]
        ok('every memory and thread floats as a node', labels.length === 5, `${labels.length} nodes (3 memories + 2 threads)`)
        const pos = labels.map((l) => {
          const m = /translate3d\(([-\d.]+)px,\s*([-\d.]+)px/.exec(l.style.transform)
          return m ? { x: Number(m[1]), y: Number(m[2]), el: l } : null
        })
        ok('the projection loop has positioned them', pos.every(Boolean), pos.map((p) => (p ? `${p.x.toFixed(0)},${p.y.toFixed(0)}` : 'none')).join(' '))
        const inside = pos.filter((p) => p && p.x > sr.left - 80 && p.x < sr.right + 80 && p.y > sr.top - 40 && p.y < sr.bottom + 40).length
        ok('nodes land on the stage', inside === labels.length, `${inside}/${labels.length}`)
        const uniq = new Set(pos.map((p) => `${Math.round(p?.x)},${Math.round(p?.y)}`))
        ok('no two nodes stack on each other', uniq.size === labels.length, `${uniq.size} distinct`)
        ok('layer faded in with the assembly', Number(cs(win, d2.querySelector('.vault-labels')).opacity) > 0.5, cs(win, d2.querySelector('.vault-labels')).opacity)
        const before = pos.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('|')
        await wait(1200)
        const after = [...d2.querySelectorAll('.vault-node')].map((l) => {
          const m = /translate3d\(([-\d.]+)px,\s*([-\d.]+)px/.exec(l.style.transform)
          return m ? `${m[1]},${m[2]}` : 'none'
        }).join('|')
        if (before !== after) ok('the brain is turning', true, 'nodes moved between samples')
        else info('the brain is turning', 'samples identical — tab is throttled, frames are not being delivered')
        const factLabels = labels.filter((l) => l.dataset.kind === 'fact').map((l) => l.textContent.trim())
        ok('memories are violet nodes', labels.filter((l) => l.dataset.kind === 'fact').length === 3, factLabels.join(' / '))

        say('\n===== THE QUICK-ACTIONS PANEL, DOCKED IN THE VAULT =====')
        const pop = d2.querySelector('.chat-popover')
        ok('the panel appears once the door is open', !!pop)
        const popBox = pop ? rect(pop) : null
        const ledgerBox = rect(d2.querySelector('.vault-ledger-btn'))
        ok('it is anchored to the stage, not the window', cs(win, pop).position === 'absolute', cs(win, pop).position)
        ok('it hugs the stage\'s right edge', Math.abs(sr.right - popBox.right) < 16, `stage right ${Math.round(sr.right)} vs panel right ${Math.round(popBox.right)}`)
        ok('it clears the ledger button', !overlaps(popBox, ledgerBox), `panel top ${Math.round(popBox.top)} vs ledger bottom ${Math.round(ledgerBox.bottom)}`)
        ok('it stays above the stage floor', popBox.bottom <= sr.bottom + 1 && popBox.top >= sr.top, `${Math.round(popBox.height)}px panel inside a ${Math.round(sr.height)}px stage`)
        const csPop = cs(win, pop)
        const gutter = pop.offsetWidth - Number(csPop.borderLeftWidth.slice(0, -2)) - Number(csPop.borderRightWidth.slice(0, -2)) - pop.clientWidth
        ok('it scrolls with no visible scrollbar', pop.scrollHeight <= pop.clientHeight || gutter < 2, `gutter ${gutter.toFixed(1)}px, content ${pop.scrollHeight} in ${pop.clientHeight}`)
        const popRows = [...pop.querySelectorAll('.chat-popover-item')]
        ok('the saved threads are listed', popRows.length === 2, popRows.map((r) => r.querySelector('span').textContent).join(' / '))
        ok('every row carries its own pin handle', popRows.length > 0 && pop.querySelectorAll('.chat-popover-pin').length === popRows.length, `${pop.querySelectorAll('.chat-popover-pin').length} pins`)
        ok('a row cannot push the pin off the panel', popRows.every((r) => rect(r).right <= popBox.right + 1), popRows.map((r) => Math.round(rect(r).right)).join(','))
        ok('the starters are a real list', pop.querySelectorAll('.chat-popover-starters button').length === 7, `${pop.querySelectorAll('.chat-popover-starters button').length} buttons (6 presets + trail)`)
        ok('the trail line closes the panel', /Trail: Start new chat/.test(pop.querySelector('.chat-popover-trail')?.textContent ?? ''))
        const foldBtn = pop.querySelector('.chat-popover-toggle')
        ok('the vault panel can be folded away', !!foldBtn, foldBtn ? foldBtn.getAttribute('aria-label') : 'no handle')
        const popRight = popBox.right
        const popTop = popBox.top
        foldBtn.click()
        await wait(600)
        const orb = d2.querySelector('.chat-popover-orb')
        ok('folding takes the whole panel away', !!orb && !d2.querySelector('.chat-popover'))
        if (orb) {
          const orbBox = rect(orb)
          /* The contract is that it folds INTO the right edge: the handle must keep
             the panel's right edge and top, not its centre (a 280px panel and a 44px
             handle cannot share a centre while sharing a corner). */
          ok('the handle keeps the panel\'s corner', Math.abs(orbBox.right - popRight) < 2 && Math.abs(orbBox.top - popTop) < 2, `right off ${(orbBox.right - popRight).toFixed(1)}px, top off ${(orbBox.top - popTop).toFixed(1)}px`)
          ok('it is a circle, not a sliver', Math.abs(orbBox.width - orbBox.height) < 2 && orbBox.width >= 40, `${Math.round(orbBox.width)}x${Math.round(orbBox.height)}`)
          ok('it stays inside the stage', orbBox.right <= sr.right + 1 && orbBox.bottom <= sr.bottom + 1 && orbBox.top >= sr.top, `${Math.round(orbBox.top)},${Math.round(orbBox.right)}`)
          orb.click()
          await wait(600)
          ok('the handle opens it again', !!d2.querySelector('.chat-popover') && !d2.querySelector('.chat-popover-orb'))
        }

        say('\n===== WIRING MEMORIES TO CHATS =====')
        const hint = d2.querySelector('.vault-hint')
        ok('hint reports the cabling', !!hint, hint?.textContent.replace(/\s+/g, ' ').trim().slice(0, 120))
        ok('two of the three memories are cabled', /2 of 3 memories are cabled/.test(hint?.textContent ?? ''))
        const factNode = labels.find((l) => l.dataset.kind === 'fact' && /Preferred language/.test(l.textContent))
        factNode.click()
        await wait(500)
        const sheet = d2.querySelector('.vault-sheet')
        ok('clicking a node opens its sheet', !!sheet)
        ok('the sheet is about that memory', /Preferred language/i.test(sheet?.querySelector('header b')?.textContent ?? ''), sheet?.querySelector('header b')?.textContent)
        ok('the fact text is shown', /Roman Urdu/.test(sheet?.querySelector('.vault-sheet-value')?.textContent ?? ''))
        ok('it names the thread it was spoken in', /Cabled into 1 thread/.test(sheet?.textContent ?? ''), /Cabled into[^<]*/.exec(sheet?.textContent ?? '')?.[0])
        const link = sheet?.querySelector('.vault-link')
        ok('the cable is clickable', /Roman Urdu replies/i.test(link?.textContent ?? ''), link?.textContent?.trim())
        const del = sheet?.querySelector('.vault-sheet-del')
        const go = sheet?.querySelector('.vault-sheet-go')
        ok('sheet actions do not collide', !!del && !!go && !overlaps(rect(del), rect(go)), `${Math.round(rect(del).right)} vs ${Math.round(rect(go).left)}`)
        ok('sheet stays inside the stage', rect(sheet).right <= sr.right + 2 && rect(sheet).bottom <= sr.bottom + 2, `${Math.round(rect(sheet).width)}x${Math.round(rect(sheet).height)}`)
        ok('a button in the sheet is the delete target', /Forget this/.test(del?.textContent ?? ''))
        win.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
        await wait(250)
        ok('escape closes the sheet', !d2.querySelector('.vault-sheet'))
        if (d2.querySelector('.vault-sheet')) { d2.querySelector('.vault-sheet-close').click(); await wait(200) }
        ok('the sheet closes', !d2.querySelector('.vault-sheet'))

        say('\n===== THE LEDGER (nothing was lost) =====')
        const ledgerBtn = d2.querySelector('.vault-ledger-btn')
        ok('ledger toggle exists', !!ledgerBtn)
        ledgerBtn.click()
        await wait(600)
        ok('toggle announces itself', ledgerBtn.getAttribute('aria-expanded') === 'true')
        const drawer = d2.querySelector('.vault-drawer')
        ok('ledger drawer opens', !!drawer)
        const cards = drawer ? [...drawer.querySelectorAll('.memory-card')] : []
        ok('both cards are still there', cards.length === 2)
        ok('add-a-fact form is intact', drawer.querySelectorAll('.memory-add input').length === 2 && !!drawer.querySelector('.memory-add button'))
        ok('save button guards an empty draft', drawer.querySelector('.memory-add button')?.disabled === true)
        ok('every memory is listed', drawer.querySelectorAll('.memory-list li').length === 3)
        ok('every thread is listed', drawer.querySelectorAll('.history-list li').length === 2)
        ok('search box is intact', !!drawer.querySelector('.history-search input'))
        ok('delete-all is behind a confirm', !!drawer.querySelector('.history-clear-all'))
        ok('drawer does not overflow the page', rect(drawer).right <= rect(page).right + 2 && rect(drawer).left >= rect(page).left - 2, `${Math.round(rect(drawer).width)} in ${Math.round(rect(page).width)}`)

        say('\n===== CLOSING THE DOOR (no leaked context) =====')
        d2.querySelector('.vault-close-door').click()
        await wait(700)
        ok('the gate is back', !!d2.querySelector('.vault-gate'))
        ok('the canvas is torn down', !d2.querySelector('.vault-scene canvas'))
        openBtn2: {
          const again = d2.querySelector('.vault-open')
          again.click()
          await wait(2800)
          const c2 = d2.querySelectorAll('.vault-scene canvas')
          ok('reopening makes exactly one canvas', c2.length === 1, `${c2.length}`)
          ok('nodes come back too', d2.querySelectorAll('.vault-node').length === 5)
        }

        say('\n===== THE SAME PANEL ON THE CHAT SCREEN =====')
        const chatNav = [...d2.querySelectorAll('.workspace-nav-btn')].find((b) => b.textContent.trim() === 'Chat')
        chatNav.click()
        await wait(900)
        const d3 = win.document
        const homePop = d3.querySelector('.chat-popover')
        ok('the panel is on the chat screen too', !!homePop)
        ok('it opens wide with no triangle to fold it', !!homePop && !homePop.querySelector('.chat-popover-toggle') && !d3.querySelector('.chat-popover-orb'))
        const pageBox = rect(d3.querySelector('.chat-page'))
        ok('here it is anchored to the chat page', cs(win, homePop).position === 'absolute', cs(win, homePop).position)
        const hr = rect(homePop)
        ok('it sits in the top-right of the working area', Math.abs(pageBox.right - hr.right) < 40 && hr.top >= pageBox.top, `right ${Math.round(hr.right)} of a page ending ${Math.round(pageBox.right)}, top ${Math.round(hr.top)}`)
        ok('it starts under the header, not over it', hr.top >= 84, `top ${Math.round(hr.top)} vs header bottom 84`)
        const promptBox = d3.querySelector('.prompt-box')
        ok('the composer stays reachable', !!promptBox && !overlaps(hr, rect(promptBox)), `panel bottom ${Math.round(hr.bottom)} vs composer top ${promptBox ? Math.round(rect(promptBox).top) : 'missing'}`)
        ok('the big button is the new-chat button', /Start new chat/.test(d3.querySelector('.chat-popover-new')?.textContent ?? ''))
        const homeRows = [...d3.querySelectorAll('.chat-popover-item')]
        ok('recent chats are listed here as well', homeRows.length === 2, `${homeRows.length} rows`)
        homeRows[0].parentElement.querySelector('.chat-popover-pin').click()
        await wait(450)
        const groupsNow = [...d3.querySelectorAll('.chat-popover-group')].map((g) => `${g.querySelector('small').textContent}:${g.querySelectorAll('.chat-popover-item').length}`)
        ok('pinning lifts a thread into its own group', groupsNow.join(',').startsWith('Pinned chats:1'), groupsNow.join(' / '))
        ok('the pin is written down, not just held in memory', JSON.parse(win.localStorage.getItem('nexora_pinned_chats') || '[]').length === 1, win.localStorage.getItem('nexora_pinned_chats'))
        const starterBtns = [...d3.querySelectorAll('.chat-popover-starters button')]
        ok('Talk call is offered as a starter', starterBtns.some((b) => /Talk call/.test(b.textContent)))
        starterBtns.find((b) => /Brainstorm/.test(b.textContent)).click()
        await wait(600)
        const composer = d3.querySelector('#chat-prompt')
        ok('a starter lands in the composer instead of firing at her', composer?.value === 'Brainstorm ideas for:', JSON.stringify(composer?.value))
        ok('the caret is parked at the end to be finished', composer?.selectionStart === composer?.value.length, `${composer?.selectionStart}/${composer?.value.length}`)
        ok('the composer has focus', d3.activeElement?.id === 'chat-prompt', d3.activeElement?.id || d3.activeElement?.tagName)
        ok('nothing was sent to the model', d3.querySelectorAll('.chat-msg').length === 0, `${d3.querySelectorAll('.chat-msg').length} bubbles`)
        ok('the panel still fits the viewport', rect(d3.querySelector('.chat-popover')).bottom <= win.innerHeight, `${Math.round(rect(d3.querySelector('.chat-popover')).bottom)} of ${win.innerHeight}`)
        ok('no horizontal overflow with the panel open', d3.documentElement.scrollWidth <= win.innerWidth, `scrollWidth ${d3.documentElement.scrollWidth}`)

        say('\n===== WITH A THREAD OPEN (the panel must not eat the chat chrome) =====')
        const openRow = [...d3.querySelectorAll('.chat-popover-item')].find((r) => /Roman Urdu replies/.test(r.querySelector('span').textContent))
        openRow.click()
        await wait(1400)
        ok('the thread really opened', /has-thread/.test(d3.querySelector('.chat-page')?.className ?? ''), d3.querySelector('.chat-page')?.className)
        ok('its turns are on screen', d3.querySelectorAll('.chat-msg').length >= 2, `${d3.querySelectorAll('.chat-msg').length} bubbles`)
        await wait(400)
        const popNow = rect(d3.querySelector('.chat-popover'))
        const bar = d3.querySelector('.chat-thread-bar')
        const pill = d3.querySelector('.chat-new-thread')
        ok('the panel does not cover the thread bar', !overlaps(popNow, rect(bar)), `panel ${Math.round(popNow.top)}-${Math.round(popNow.bottom)} vs bar ${Math.round(rect(bar).top)}-${Math.round(rect(bar).bottom)}`)
        ok('the panel does not cover New chat', !overlaps(popNow, rect(pill)), `panel right ${Math.round(popNow.right)} vs pill ${Math.round(rect(pill).left)}-${Math.round(rect(pill).right)}`)
        ok('the composer is still reachable with a thread', !overlaps(popNow, rect(d3.querySelector('.prompt-box'))), `panel bottom ${Math.round(popNow.bottom)} vs composer top ${Math.round(rect(d3.querySelector('.prompt-box')).top)}`)
        ok('the panel does not spill out of the page', popNow.right <= rect(d3.querySelector('.chat-page')).right + 1 && popNow.bottom <= win.innerHeight, `${Math.round(popNow.width)}x${Math.round(popNow.height)} at ${Math.round(popNow.left)},${Math.round(popNow.top)}`)
        info('with a thread', `panel ${Math.round(popNow.top)}..${Math.round(popNow.bottom)} · bar ${Math.round(rect(bar).top)}..${Math.round(rect(bar).bottom)} · composer ${Math.round(rect(d3.querySelector('.prompt-box')).top)}`)
        info('page errors', (win.__errs ?? []).join(' | ') || 'none')
        ok('the app threw nothing', (win.__errs ?? []).length === 0, win.__errs?.join(' | '))
        ok('no vite error overlay', !d2.querySelector('vite-error-overlay'))

        restore()
        say(`\n${fails === 0 ? 'ALL CHECKS PASSED' : `FAILURES: ${fails}`}`)
      }

      main().catch((err) => {
        restore()
        say(`threw: ${err.message}`)
        document.getElementById('out').innerText = log.join('\n')
      })
    </script>
  </body>
</html>
